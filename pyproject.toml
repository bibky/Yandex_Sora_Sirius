[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dml"
version = "0.1.0"
description = "Reproduction of 'Differential Machine Learning' (Huge & Savine, 2020)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.2",
    "matplotlib"
]

[project.optional-dependencies]
torch = ["torch>=2.2,<3", "tqdm"]
notebooks = ["jupyterlab", "ipykernel", "tqdm", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
